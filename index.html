<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peds Lock-In: Milestones, Microbes &amp; Shots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe6d4; --paper:#fbf7ee; --paper2:#f4ecdc; --line:#d6c7a6; --ink:#23221f; --ink2:#3d3a33; --mute:#7a7262;
  --navy:#1d2a36; --teal:#1c4a5c; --tealL:#2b6378; --tealBg:#e3ecee;
  --gold:#b58b2b; --goldL:#dcc082; --goldBg:#f6ecd2; --caramel:#8b5a2b; --caramelBg:#f3e6d6;
  --ok:#3d6b45; --okBg:#e6f0e3; --bad:#9a3324; --badBg:#f8e9e4;
  --wood1:#e9d3a6; --wood2:#d9b97c;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:'Fraunces',Georgia,'Times New Roman',serif;line-height:1.15}
.wrap{max-width:980px;margin:0 auto;padding:1.2rem 1rem 3rem}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.topbar-in{max-width:980px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.brand{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:1.15rem;letter-spacing:.2px;display:flex;align-items:center;gap:.45rem;background:none;border:none;color:#fff}
.brand small{font-family:'Inter',sans-serif;font-weight:600;font-size:.72rem;color:var(--goldL);margin-left:.2rem}
.stats{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:.22rem .7rem;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill b{color:var(--goldL)}
.lvlbar{width:110px;height:8px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.lvlbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:1.2rem;align-items:end;margin:1.2rem 0 1.4rem}
.hero h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:800;color:var(--navy)}
.hero p{color:var(--ink2);margin-top:.6rem;max-width:58ch}
.countdown{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:1rem 1.1rem}
.countdown .big{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:2.4rem;color:var(--teal);line-height:1}
.countdown .lbl{font-size:.85rem;color:var(--mute);margin-top:.2rem}
.countdown .row{display:flex;justify-content:space-between;margin-top:.7rem;font-size:.84rem;color:var(--ink2)}
.section-h{display:flex;align-items:baseline;gap:.7rem;margin:1.5rem 0 .7rem}
.section-h h2{font-size:1.35rem;color:var(--navy)}
.section-h span{font-size:.86rem;color:var(--mute)}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.game{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:1rem;text-align:left;display:flex;flex-direction:column;gap:.35rem;min-height:150px;transition:transform .12s,border-color .12s}
.game:hover{transform:translateY(-2px);border-color:var(--gold)}
.game .ico{font-size:1.7rem}
.game h3{font-size:1.12rem;color:var(--navy)}
.game p{font-size:.86rem;color:var(--ink2);flex:1}
.game .best{font-size:.76rem;color:var(--caramel);font-weight:700}
.game.m3{border-left:5px solid var(--teal)} .game.m2{border-left:5px solid var(--gold)} .game.mix{border-left:5px solid var(--caramel)}
.review-tile{display:flex;align-items:center;gap:1rem;background:var(--goldBg);border:1.5px solid var(--goldL);border-radius:14px;padding:1rem 1.1rem;margin-top:.8rem;width:100%;text-align:left}
.review-tile .n{font-family:'Fraunces',Georgia,serif;font-size:2rem;font-weight:800;color:var(--caramel);min-width:2.2ch;text-align:center}
.review-tile h3{font-size:1.05rem;color:var(--navy)}
.review-tile p{font-size:.86rem;color:var(--ink2)}
.foot-note{font-size:.8rem;color:var(--mute);margin-top:1.4rem}
.linkbtn{background:none;border:none;text-decoration:underline;color:var(--teal);font-size:.8rem}

/* ---------- game shell ---------- */
.gtop{display:flex;align-items:center;gap:.6rem;margin:1rem 0 .9rem;flex-wrap:wrap}
.back{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:.4rem .8rem;font-weight:600;font-size:.86rem}
.gtitle{font-family:'Fraunces',Georgia,serif;font-size:1.4rem;font-weight:800;color:var(--navy)}
.hud{margin-left:auto;display:flex;gap:.45rem;flex-wrap:wrap}
.hud .pill{background:var(--paper);border-color:var(--line);color:var(--ink2)}
.hud .pill b{color:var(--teal)}
.progress{height:6px;background:var(--paper2);border-radius:6px;overflow:hidden;margin-bottom:1rem}
.progress i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:1.2rem 1.2rem 1.3rem}
.prompt{font-size:1.2rem;font-weight:700;color:var(--navy);line-height:1.4}
.sub{font-size:.88rem;color:var(--mute);margin-top:.3rem}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.55rem;margin-top:1rem}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:.75rem .9rem;text-align:left;font-size:.95rem;font-weight:600;color:var(--ink);transition:background .12s,border-color .12s}
.opt:hover:not([disabled]){border-color:var(--teal);background:var(--tealBg)}
.opt.right{background:var(--okBg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--badBg);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:1rem;border-radius:12px;padding:.85rem 1rem;font-size:.93rem;line-height:1.55;display:none}
.fb.show{display:block}
.fb.good{background:var(--okBg);border:1.5px solid #a9c9a8}
.fb.bad{background:var(--badBg);border:1.5px solid #e0aa9a}
.fb strong{display:block;margin-bottom:.2rem}
.next{margin-top:1rem;background:var(--teal);color:#fff;border:none;border-radius:12px;padding:.75rem 1.4rem;font-weight:700;font-size:.95rem;display:none}
.next.show{display:inline-block}
.next:hover{background:var(--tealL)}
.combo{font-weight:800;color:var(--gold)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}

/* ---------- growth ruler (signature element) ---------- */
.milestone-card{display:flex;gap:.9rem;align-items:center;background:#fff;border:2px dashed var(--goldL);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1.1rem}
.milestone-card .em{font-size:2rem}
.milestone-card .t{font-size:1.15rem;font-weight:700;color:var(--navy)}
.milestone-card .d{font-size:.84rem;color:var(--mute)}
.timer{height:5px;background:var(--paper2);border-radius:4px;overflow:hidden;margin-bottom:1rem}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.ruler-wrap{overflow-x:auto;padding-bottom:.4rem}
.ruler{position:relative;min-width:760px;background:linear-gradient(180deg,var(--wood1),var(--wood2));border:2px solid #b8955a;border-radius:10px;padding:2.1rem .6rem .6rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.ruler::before{content:"";position:absolute;left:.6rem;right:.6rem;top:.45rem;height:1.2rem;background:
  repeating-linear-gradient(90deg,rgba(60,40,10,.55) 0 1px,transparent 1px 12px),
  repeating-linear-gradient(90deg,rgba(60,40,10,.8) 0 2px,transparent 2px 60px);
  background-size:auto 55%,auto 100%;background-repeat:repeat-x;background-position:0 0,0 0}
.ruler-slots{display:grid;grid-template-columns:repeat(13,1fr);gap:.3rem;position:relative}
.slot{background:var(--paper);border:1.5px solid #b8955a;border-radius:8px;padding:.55rem .1rem;font-weight:800;font-size:.86rem;color:var(--navy);text-align:center;transition:transform .12s}
.slot small{display:block;font-weight:600;font-size:.66rem;color:var(--mute)}
.slot:hover:not([disabled]){background:var(--goldBg);transform:translateY(-2px)}
.slot.right{background:var(--ok);color:#fff;border-color:var(--ok)} .slot.right small{color:#e6f0e3}
.slot.wrong{background:var(--bad);color:#fff;border-color:var(--bad)} .slot.wrong small{color:#f8e9e4}
.slot.hint{background:var(--ok);border-color:var(--ok);color:#fff}.slot.hint small{color:#e6f0e3}.slot.hint::after,.slot.right::after{content:'✓';display:block;font-size:.8rem;line-height:1}
.slot .placed{display:block;font-size:.62rem;font-weight:600;color:var(--caramel);margin-top:.15rem;line-height:1.2}
.ruler-legend{display:grid;grid-template-columns:repeat(13,1fr);gap:.3rem;min-width:760px;padding:0 .6rem;margin-top:.35rem;font-size:.75rem;font-weight:600;color:var(--mute);text-align:center}.ruler-legend span{border-top:2px solid var(--line);padding-top:.2rem}

/* ---------- detective ---------- */
.clues{list-style:none;display:flex;flex-direction:column;gap:.45rem;margin-top:.8rem}
.clue{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:.6rem .8rem;font-size:.95rem}
.clue.hidden{color:var(--mute);border-left-color:var(--line);background:var(--paper2);font-style:italic}
.clue-btn{margin-top:.6rem;background:var(--paper2);border:1.5px solid var(--line);border-radius:10px;padding:.5rem .9rem;font-weight:600;font-size:.86rem}
.worth{font-size:.86rem;color:var(--caramel);font-weight:700;margin-top:.6rem}

/* ---------- memory ---------- */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin-top:1rem}
.mcard{aspect-ratio:1.25/1;border-radius:12px;border:1.5px solid var(--line);background:var(--teal);color:#fff;font-weight:700;font-size:.86rem;padding:.4rem;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25}
.mcard .back-face{font-family:'Fraunces',Georgia,serif;font-size:1.4rem;color:var(--goldL)}
.mcard.up{background:#fff;color:var(--navy);border:2px solid var(--gold);box-shadow:0 0 0 3px var(--goldBg)}
.mcard.done{background:var(--okBg);color:var(--ok);border-color:var(--ok);cursor:default}
.mcard.miss{background:#fff;color:var(--navy);border-color:var(--bad);border-width:2px}
.ask{margin-top:1rem;min-height:3.2rem;border-radius:12px;padding:.8rem 1rem;background:var(--paper2);border:1.5px dashed var(--line)}
.ask.on{background:#fff;border:1.5px solid var(--gold)}
.ask.ask-ok{background:var(--okBg);border-color:var(--ok)}
.ask.ask-bad{background:var(--badBg);border-color:var(--bad)}
.ask-hint{color:var(--mute);font-size:.9rem}
.ask-q{font-weight:800;color:var(--navy);font-size:1.02rem}
.ask-ok .ask-q{color:var(--ok)}.ask-bad .ask-q{color:var(--bad)}
.ask-pair{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.5rem;font-weight:600}
.ask-pair span:not(.ask-amp){background:var(--goldBg);border:1.5px solid var(--goldL);border-radius:8px;padding:.3rem .6rem}
.ask-amp{color:var(--mute);font-weight:800}
.ask-btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.2rem}
.ask-btns .primary,.ask-btns .secondary{margin-top:.6rem}
.deck-pick{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.8rem}
.deck-btn{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:.4rem .85rem;font-size:.84rem;font-weight:600}
.deck-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- isolation sort ---------- */
.bug{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;color:var(--navy);text-align:center;margin:.8rem 0 .2rem}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1rem}
.bin{border-radius:14px;padding:1rem .5rem;font-weight:800;font-size:1rem;border:2px solid;background:#fff;text-align:center}
.bin small{display:block;font-weight:600;font-size:.74rem;margin-top:.2rem;color:var(--mute)}
.bin.air{border-color:#1c4a5c;color:#1c4a5c} .bin.drop{border-color:#b58b2b;color:#8a6418} .bin.con{border-color:#8b5a2b;color:#8b5a2b}
.bin:hover:not([disabled]){background:var(--paper2)}
.bin.right{background:var(--okBg)} .bin.wrong{background:var(--badBg)}
.hearts{font-size:1.05rem;letter-spacing:2px}

/* ---------- shot clock ---------- */
.visit{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.visit .age{font-family:'Fraunces',Georgia,serif;font-size:2rem;font-weight:800;color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1rem}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:.5rem .9rem;font-weight:700;font-size:.9rem;color:var(--ink2)}
.chip.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.c-ok{background:var(--okBg);border-color:var(--ok);color:var(--ok)}
.chip.c-miss{background:#fff;border:2px dashed var(--ok);color:var(--ok)}
.chip.c-bad{background:var(--badBg);border-color:var(--bad);color:var(--bad)}
.chip.c-opt{background:var(--goldBg);border-color:var(--goldL);color:#5c4512}
.legend{display:flex;flex-wrap:wrap;gap:.8rem;font-size:.78rem;color:var(--mute);margin-top:.7rem}
.legend span::before{content:"";display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px;border:1.5px solid}
.legend .l1::before{background:var(--okBg);border-color:var(--ok)} .legend .l2::before{border:2px dashed var(--ok)} .legend .l3::before{background:var(--badBg);border-color:var(--bad)} .legend .l4::before{background:var(--goldBg);border-color:var(--goldL)}
.primary{background:var(--teal);color:#fff;border:none;border-radius:12px;padding:.7rem 1.3rem;font-weight:700;margin-top:1rem}
.primary:hover{background:var(--tealL)}
.primary[disabled]{opacity:.45;cursor:default}

/* ---------- lightning ---------- */
.clock{font-family:'Fraunces',Georgia,serif;font-size:2.4rem;font-weight:800;color:var(--teal);text-align:center}
.clock.low{color:var(--bad)}
.vit-list{display:flex;flex-direction:column;gap:.55rem;margin-top:1rem}
.vit-row{display:grid;grid-template-columns:1.2fr 1fr auto;gap:.6rem;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:.65rem .8rem}
.vit-k{font-weight:700;color:var(--navy)}
.vit-v{font-family:'Fraunces',Georgia,serif;font-size:1.35rem;font-weight:800;color:var(--teal)}
.vit-btns{display:flex;gap:.35rem}
.vbtn{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:.4rem .8rem;font-weight:700;font-size:.85rem}
.vbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.vit-why{grid-column:1/-1;font-size:.86rem;color:var(--ink2)}
.vit-why:empty{display:none}
.vit-row.v-ok{border-color:var(--ok);background:var(--okBg)}
.vit-row.v-bad{border-color:var(--bad);background:var(--badBg)}
@media (max-width:520px){.vit-row{grid-template-columns:1fr 1fr}.vit-btns{grid-column:1/-1}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}

/* ---------- results ---------- */
.results h2{font-size:1.7rem;color:var(--navy)}
.score-line{font-family:'Fraunces',Georgia,serif;font-size:3rem;font-weight:800;color:var(--teal);line-height:1;margin:.5rem 0}
.missed-list{margin-top:1rem;display:flex;flex-direction:column;gap:.5rem}
.missed-item{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--bad);border-radius:10px;padding:.6rem .8rem;font-size:.9rem}
.missed-item b{color:var(--navy)}
.res-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
.secondary{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:.7rem 1.2rem;font-weight:700}

.toast{visibility:hidden;position:fixed;left:50%;top:calc(4.4rem + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-30%);opacity:0;background:var(--navy);color:#fff;border:2px solid var(--gold);border-radius:12px;padding:.6rem 1rem;font-weight:700;font-size:.9rem;z-index:50;transition:transform .3s,opacity .3s;max-width:90vw;text-align:center}
.toast.show{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .games{grid-template-columns:1fr 1fr}
  .opts{grid-template-columns:1fr}
  .mem-grid{grid-template-columns:repeat(3,1fr)}
  .lvlbar{display:none}
  .ruler{min-width:0;padding-top:.6rem}.ruler::before{display:none}
  .ruler-slots{grid-template-columns:repeat(7,1fr)}
  .ruler-legend{display:none}
}
@media (max-width:460px){
  .games{grid-template-columns:1fr}
  .bins{grid-template-columns:1fr}
  .topbar-in{gap:.4rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <button class="brand" id="homeBtn" aria-label="Back to game menu">🧸 Peds Lock-In <small>NRSG 4504 · Exam 1</small></button>
  <div class="stats">
    <span class="pill" id="lvlName">Newborn</span>
    <span class="lvlbar" aria-hidden="true"><i id="lvlFill"></i></span>
    <span class="pill"><b id="xpTxt">0</b> XP</span>
    <span class="pill">🔥 best streak <b id="bestStreak">0</b></span>
  </div>
</div></header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   DATA — every fact comes from the Module 2 and Module 3 study-sheet tabs
   ===================================================================== */
var AGES=[{v:2,l:'2',u:'mo'},{v:4,l:'4',u:'mo'},{v:6,l:'6',u:'mo'},{v:9,l:'9',u:'mo'},{v:12,l:'12',u:'mo'},{v:15,l:'15',u:'mo'},{v:18,l:'18',u:'mo'},{v:24,l:'24',u:'mo'},{v:30,l:'30',u:'mo'},{v:36,l:'3',u:'yr'},{v:48,l:'4',u:'yr'},{v:60,l:'5',u:'yr'},{v:72,l:'6',u:'yr'}];
function ageLabel(v){var a=AGES.filter(function(x){return x.v===v;})[0];return a?a.l+' '+a.u:v+' mo';}
var MILESTONES=[
 {id:'ms1',em:'😊',t:'Social smile',a:[2],why:'Social smile by 2 months is the first social milestone; no smile by ~2 months is a red flag.'},
 {id:'ms2',em:'💪',t:'Lifts head when lying on tummy',a:[2],why:'At 1–2 months, infants turn the head when supine and lift it on their tummy.'},
 {id:'ms3',em:'🎯',t:'Holds head steady, no head lag',a:[4],why:'Head steady without support by 4 months. Head lag after ~4–5 months is a concern.'},
 {id:'ms4',em:'🙌',t:'Moro (startle) reflex disappears',a:[4],why:'Moro is usually gone by ~4 months. A persistent Moro reflex is unexpected.'},
 {id:'ms5',em:'✊',t:'Crude palmar grasp, brings hands to mouth',a:[4],why:'4 months = whole-hand (crude palmar) grasp, hands to mouth, swings at toys.'},
 {id:'ms6',em:'🔄',t:'Rolls tummy-to-back; sits leaning on hands',a:[6],why:'6 months: rolls (tummy-to-back and back-to-front) and "tripod" sits leaning on hands.'},
 {id:'ms7',em:'🗣️',t:'Babbles ("ba-ba," "ma-ma")',a:[6],why:'Coos → babbles by 6 months → first words ~12 months. No babbling by 6 months is a red flag.'},
 {id:'ms8',em:'🧸',t:'Picks up a dropped toy',a:[6],why:'Around 6 months infants reach intentionally and can pick up a dropped toy.'},
 {id:'ms9',em:'😢',t:'Separation anxiety begins',a:[6,9],why:'Separation anxiety starts around 6–8 months, as object permanence develops (4–8 months).'},
 {id:'ms10',em:'🪑',t:'Sits without support; crawls',a:[9],why:'9 months: sits alone, gets into sitting by self, crawls or creeps.'},

/* =====================================================================

   ===================================================================== */
var KEY='peds_lockin_v1';
var S={xp:0,best:{},bestStreak:0,misses:[]};
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);S.xp=o.xp||0;S.best=o.best||{};S.bestStreak=o.bestStreak||0;S.misses=o.misses||[];}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function level(){var cur=LEVELS[0],nxt=null;for(var i=0;i<LEVELS.length;i++){if(S.xp>=LEVELS[i][0]){cur=LEVELS[i];nxt=LEVELS[i+1]||null;}}return {name:cur[1],pct:nxt?Math.round((S.xp-cur[0])/(nxt[0]-cur[0])*100):100,next:nxt};}
function refreshTop(){var l=level();$('lvlName').textContent=l.name;$('lvlFill').style.width=l.pct+'%';$('xpTxt').textContent=S.xp;$('bestStreak').textContent=S.bestStreak;}
function addXP(n){var before=level().name;S.xp+=n;var after=level().name;refreshTop();save();if(after!==before)toast('🎉 Level up! You\u2019re now a '+after+'.');}
function addMiss(m){ // m: {key,prompt,options,answer,explain}
  S.misses=S.misses.filter(function(x){return x.key!==m.key;});S.misses.unshift(m);if(S.misses.length>80)S.misses.length=80;save();}
function clearMiss(key){S.misses=S.misses.filter(function(x){return x.key!==key;});save();}
function setBest(g,score){if(!S.best[g]||score>S.best[g]){S.best[g]=score;save();return true;}return false;}

/* =====================================================================
   HELPERS
   ===================================================================== */
function $(id){return document.getElementById(id);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
var toastT;function toast(t){var x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){x.classList.remove('show');},2600);}
var timers=[];function clearTimers(){timers.forEach(function(t){clearInterval(t);clearTimeout(t);});timers=[];}
function mult(streak){return streak>=6?3:(streak>=3?2:1);}
var run=null; // current round {streak, score, correct, total, missed:[]}
function newRun(){run={streak:0,score:0,correct:0,total:0,missed:[]};}
function hit(base){run.streak++;run.correct++;run.total++;var m=mult(run.streak);var pts=base*m;run.score+=pts;addXP(pts);if(run.streak>S.bestStreak){S.bestStreak=run.streak;save();refreshTop();}return {pts:pts,m:m};}
function miss(rec){run.streak=0;run.total++;run.missed.push(rec);if(rec.key)addMiss(rec);}
function hud(extra){return '<div class="hud">'+(extra||'')+'<span class="pill">Score <b id="hScore">'+run.score+'</b></span><span class="pill">🔥 <b id="hStreak">'+run.streak+'</b>'+(mult(run.streak)>1?' <span class="combo">×'+mult(run.streak)+'</span>':'')+'</span></div>';}
function updHud(){if($('hScore'))$('hScore').textContent=run.score;var s=$('hStreak');if(s){s.parentNode.innerHTML='🔥 <b id="hStreak">'+run.streak+'</b>'+(mult(run.streak)>1?' <span class="combo">×'+mult(run.streak)+'</span>':'');}}
function shell(title){clearTimers();var app=$('app');app.innerHTML='';var top=el('div','gtop');top.innerHTML='<button class="back" id="bk">← All games</button><div class="gtitle">'+title+'</div><div id="hudBox" style="margin-left:auto"></div>';app.appendChild(top);$('bk').onclick=home;var p=el('div','progress');p.innerHTML='<i id="prog"></i>';app.appendChild(p);var c=el('div','card');c.id='stage';app.appendChild(c);window.scrollTo(0,0);return c;}

function prog(i,n){var p=$('prog');if(p)p.style.width=Math.round(i/n*100)+'%';}

/* ---------- results ---------- */
function results(game,title,replay){
  clearTimers();
  var pct=run.total?Math.round(run.correct/run.total*100):0;
  var nb=setBest(game,run.score);
  var c=$('stage');prog(1,1);
  var msg=pct>=90?'Locked in. That content is sticking. 🔒':pct>=70?'Solid round. Replay to make the misses stick.':'These are worth another pass. The misses below are saved to your review deck.';
  var h='<div class="results"><h2>'+title+' complete</h2><div class="score-line">'+run.score+' pts</div><p>'+run.correct+' of '+run.total+' correct ('+pct+'%)'+(nb?' · <b style="color:var(--caramel)">New best!</b>':'')+'</p><p class="sub">'+msg+'</p>';
  if(run.missed.length){h+='<h3 style="margin-top:1.2rem;font-size:1.1rem;color:var(--navy)">Lock these in</h3><div class="missed-list">';
    run.missed.forEach(function(m){h+='<div class="missed-item"><b>'+esc(m.prompt)+'</b><br>✓ '+esc(m.options[m.answer])+(m.explain?'<br><span style="color:var(--ink2)">'+esc(m.explain)+'</span>':'')+'</div>';});h+='</div>';}
  h+='<div class="res-actions"><button class="primary" id="again">Play again</button><button class="secondary" id="toMenu">All games</button>'+(S.misses.length?'<button class="secondary" id="toRev">Review my misses ('+S.misses.length+')</button>':'')+'</div></div>';
  c.innerHTML=h;$('again').onclick=replay;$('toMenu').onclick=home;if($('toRev'))$('toRev').onclick=reviewGame;
  if(pct===100&&run.total>=5)toast('💯 Perfect round!');
}

    function choose(v,btn){if(done)return;done=true;clearInterval(tick);var bs=slots.querySelectorAll('.slot');bs.forEach(function(b){b.disabled=true;});
      var ok=m.a.indexOf(v)!==-1;var fast=(Date.now()-t0)<6000;

      updHud();var nx=$('nx');nx.classList.add('show');nx.focus();nx.onclick=function(){i++;show();};}
  }
  show();
}

        else{b.classList.add('wrong');miss({key:'kid-'+g+'-'+clues[0].slice(0,24),prompt:'Which age group? "'+clues[0]+'"',options:[g],answer:0,explain:'All of these describe a '+g.toLowerCase()+': '+clues.join(' ')});fb.className='fb show bad';fb.innerHTML='<strong>✗ This was a '+g.toLowerCase()+' ('+GROUP_AGES[g]+')</strong>Reread the clues above: each one is a '+g.toLowerCase()+' fact.';}

/* =====================================================================
   GAME 3 — FLIP & MATCH (memory)
   ===================================================================== */
function memoryGame(deckIdx){
  newRun();var c=shell('Flip & Match');
  if(deckIdx===undefined){
    var h='<div class="prompt">Pick a deck</div><div class="sub">Flip two cards, then decide whether they match. Points come from your Yes/No calls.</div><div class="deck-pick">';
    DECKS.forEach(function(d,k){h+='<button class="deck-btn" data-k="'+k+'">'+(d.mod===2?'🟡 ':'🔵 ')+esc(d.name)+(S.best['mem'+k]?' · best '+S.best['mem'+k]:'')+'</button>';});
    h+='</div><p class="sub" style="margin-top:.8rem">🟡 Module 2 · 🔵 Module 3</p>';c.innerHTML=h;
    c.querySelectorAll('.deck-btn').forEach(function(b){b.onclick=function(){memoryGame(+b.dataset.k);};});setHud();return;}
  var D=DECKS[deckIdx];var cards=[];D.pairs.forEach(function(p,k){cards.push({t:p[0],p:k});cards.push({t:p[1],p:k});});cards=shuffle(cards);
  var up=[],matched=0,checks=0,lock=false;
  c.innerHTML='<div class="prompt">'+esc(D.name)+'</div><div class="sub">Flip two cards, then decide: do they match? You score on your answer, not on luck. Find all 6 pairs.</div><div class="mem-grid" id="mg"></div><div class="ask" id="ask"></div>';
  var g=$('mg');setHud('<span class="pill">Pairs <b id="pairsFound">0</b>/'+D.pairs.length+'</span>');
  cards.forEach(function(cd,k){var b=el('button','mcard','<span class="back-face">?</span>');b.setAttribute('aria-label','Hidden card');b.onclick=function(){flip(k,b);};g.appendChild(b);cd.el=b;});
  var ask=$('ask');
  function idle(){ask.className='ask';ask.innerHTML='<span class="ask-hint">'+(up.length===1?'Flip one more card.':'Flip two cards.')+'</span>';}
  idle();
  function flip(k,b){if(lock||cards[k].done||up.indexOf(k)!==-1)return;b.classList.add('up');b.textContent=cards[k].t;b.setAttribute('aria-label',cards[k].t);up.push(k);
    if(up.length<2){idle();return;}
    lock=true;var a=cards[up[0]],z=cards[up[1]];
    ask.className='ask on';
    ask.innerHTML='<div class="ask-q">Do these two cards match?</div><div class="ask-pair"><span>'+esc(a.t)+'</span><span class="ask-amp">+</span><span>'+esc(z.t)+'</span></div><div class="ask-btns"><button class="primary" id="yes">Yes, they match</button><button class="secondary" id="no">No match</button></div>';
    $('yes').onclick=function(){judge(true);};$('no').onclick=function(){judge(false);};$('yes').focus();
    function judge(saidYes){checks++;var isMatch=a.p===z.p;var right=saidYes===isMatch;
      var msg;
      if(right){var r=hit(isMatch?15:8);updHud();msg=isMatch?'✓ Correct, they match! +'+r.pts+(r.m>1?' (×'+r.m+' streak)':''):'✓ Correct, not a match. +'+r.pts+(r.m>1?' (×'+r.m+' streak)':'')+' Both cards go back.';}
      else{run.streak=0;run.total++;updHud();msg=isMatch?'✗ Actually, these DO match.':'✗ Not a match. Both cards go back; keep looking.';
        run.missed.push({prompt:a.t+' + '+z.t,options:[isMatch?'These match':'Not a match'],answer:0,explain:isMatch?a.t+' pairs with '+z.t+'.':''});}
      if(isMatch){a.done=z.done=true;a.el.classList.remove('up');z.el.classList.remove('up');a.el.classList.add('done');z.el.classList.add('done');matched++;$('pairsFound').textContent=matched;prog(matched,D.pairs.length);}
      else{a.el.classList.add('miss');z.el.classList.add('miss');}
      ask.className='ask on '+(right?'ask-ok':'ask-bad');
      ask.innerHTML='<div class="ask-q">'+msg+'</div><div class="ask-btns"><button class="primary" id="cont">'+(matched===D.pairs.length?'See results':(isMatch?'Keep going':'Put them back'))+'</button></div>';
      $('cont').focus();
      $('cont').onclick=function(){
        if(!isMatch){[a,z].forEach(function(x){x.el.classList.remove('up','miss');x.el.innerHTML='<span class="back-face">?</span>';x.el.setAttribute('aria-label','Hidden card');});}
        up=[];lock=false;
        if(matched===D.pairs.length)finish();else idle();};
    }
  }
  function finish(){
    var pct=checks?Math.round(run.correct/checks*100):0;var nb=setBest('mem'+deckIdx,run.score);
    var pairsList=D.pairs.map(function(p){return '<div class="missed-item" style="border-left-color:var(--ok)"><b>'+esc(p[0])+'</b> → '+esc(p[1])+'</div>';}).join('');
    c.innerHTML='<div class="results"><h2>Deck cleared!</h2><div class="score-line">'+run.score+' pts</div><p>'+run.correct+' of '+checks+' match calls correct ('+pct+'%)'+(nb?' · <b style="color:var(--caramel)">New best!</b>':'')+'</p><h3 style="margin-top:1.1rem;font-size:1.05rem;color:var(--navy)">All 6 pairs: say each one out loud</h3><div class="missed-list">'+pairsList+'</div><div class="res-actions"><button class="primary" id="again">Play this deck again</button><button class="secondary" id="other">Pick another deck</button><button class="secondary" id="toMenu">All games</button></div></div>';
    $('again').onclick=function(){memoryGame(deckIdx);};$('other').onclick=function(){memoryGame();};$('toMenu').onclick=home;
    if(pct===100)toast('💯 Every match call was right!');
  }
}


/* =====================================================================
   VITALS CHECK
   ===================================================================== */
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function vitalVal(lo,hi,normal){
  if(normal){var pad=Math.max(1,Math.floor((hi-lo)*0.12));return rnd(lo+pad,hi-pad);}
  var d=Math.max(5,Math.round((hi-lo)*0.2))+rnd(0,Math.max(3,Math.round((hi-lo)*0.2)));
  if(Math.random()<0.6||lo-d<6)return hi+d;return lo-d;
}
function makeVitalsCase(){
  var R=VR[Math.floor(Math.random()*VR.length)];var age=R.ages[Math.floor(Math.random()*R.ages.length)];
  var items=[];
  var hrN=Math.random()<0.55,rrN=Math.random()<0.55;
  var hr=vitalVal(R.hr[0],R.hr[1],hrN),rr=vitalVal(R.rr[0],R.rr[1],rrN);
  items.push({k:'Heart rate',v:hr+'/min',normal:hrN,range:R.hr[0]+'–'+R.hr[1],why:hrN?'Within the '+R.g.toLowerCase()+' range of '+R.hr[0]+'–'+R.hr[1]+'.':(hr>R.hr[1]?'Above':'Below')+' the '+R.g.toLowerCase()+' range of '+R.hr[0]+'–'+R.hr[1]+' ('+(hr>R.hr[1]?'tachycardia':'bradycardia')+').'});
  items.push({k:'Respiratory rate',v:rr+'/min',normal:rrN,range:R.rr[0]+'–'+R.rr[1],why:rrN?'Within the '+R.g.toLowerCase()+' range of '+R.rr[0]+'–'+R.rr[1]+'.':(rr>R.rr[1]?'Above':'Below')+' the '+R.g.toLowerCase()+' range of '+R.rr[0]+'–'+R.rr[1]+' ('+(rr>R.rr[1]?'tachypnea':'bradypnea')+').'});
  if(R.bp){var bpN=Math.random()<0.5;var sys=bpN?rnd(100,116):rnd(132,146),dia=bpN?rnd(60,76):rnd(81,92);
    items.push({k:'Blood pressure',v:sys+'/'+dia+' mm Hg',normal:bpN,range:'<120/80',why:bpN?'Normal adolescent BP is under 120/80.':'Adolescent hypertension is 130/80 or higher (confirm on repeated readings with the right cuff size).'});}
  return {g:R.g,age:age,items:items};
}
function vitalsGame(){
  newRun();var c=shell('Vitals Check');var N=8,i=0;
  function show(){
    if(i>=N)return results('vitals','Vitals Check',vitalsGame);
    setHud();prog(i,N);var cs=makeVitalsCase();var ans={};var done=false;
    var h='<div class="visit"><span class="age" style="font-size:1.6rem">'+esc(cs.age)+'</span><span class="sub">Resting and calm. Mark each vital sign Normal or Report.</span></div><div class="vit-list" id="vl">';
    cs.items.forEach(function(it,k){h+='<div class="vit-row" id="vr'+k+'"><div class="vit-k">'+it.k+'</div><div class="vit-v">'+it.v+'</div><div class="vit-btns"><button class="vbtn" data-k="'+k+'" data-a="1">Normal</button><button class="vbtn" data-k="'+k+'" data-a="0">Report</button></div><div class="vit-why" id="vw'+k+'"></div></div>';});
    h+='</div><button class="primary" id="chk" disabled>Check vitals</button><div class="fb" id="fb"></div><button class="next" id="nx">Next child</button>';
    c.innerHTML=h;
    c.querySelectorAll('.vbtn').forEach(function(b){b.onclick=function(){if(done)return;var k=+b.dataset.k;ans[k]=b.dataset.a==='1';b.parentNode.querySelectorAll('.vbtn').forEach(function(x){x.classList.toggle('on',x===b);});$('chk').disabled=Object.keys(ans).length<cs.items.length;};});
    $('chk').onclick=function(){if(done)return;done=true;$('chk').classList.add('hide');var allOk=true;
      cs.items.forEach(function(it,k){var ok=ans[k]===it.normal;var row=$('vr'+k);row.classList.add(ok?'v-ok':'v-bad');$('vw'+k).innerHTML=(ok?'✓ ':'✗ ')+'<b>'+(it.normal?'Normal':'Report')+'.</b> '+esc(it.why);
        row.querySelectorAll('.vbtn').forEach(function(x){x.disabled=true;});
        if(ok){hit(8);}else{allOk=false;miss({key:'vit-'+cs.g+'-'+it.k,prompt:cs.g+' ('+cs.age+'): '+it.k+' normal range?',options:[it.range],answer:0,explain:it.why});}});
      var fb=$('fb');fb.className='fb show '+(allOk?'good':'bad');fb.innerHTML='<strong>'+(allOk?'✓ All correct!':'Review the ranges above')+'</strong>'+cs.g+' normals: HR '+cs.items[0].range+', RR '+cs.items[1].range+(cs.items[2]?', BP '+cs.items[2].range+' (HTN ≥130/80)':'')+'.';
      updHud();var nx=$('nx');nx.classList.add('show');nx.focus();nx.onclick=function(){i++;show();};};
  }

}

/* =====================================================================
   GAME 4 — RASH DETECTIVE
   ===================================================================== */
function rashGame(){
  newRun();var c=shell('Rash Detective');var deck=pick(DISEASES,8),i=0;
  function show(){
    if(i>=deck.length)return results('rash','Rash Detective',rashGame);
    setHud();prog(i,deck.length);var d=deck[i];var shown=1,done=false;
    var distract=pick(DISEASES.filter(function(x){return x.id!==d.id;}),5);var options=shuffle([d].concat(distract));
    function render(){
      var worth=[30,22,15,10][shown-1];
      var h='<div class="prompt">Name that disease</div><div class="sub">Reveal clues one at a time. Then name the isolation precaution for a bonus.</div><ul class="clues">';
      d.clues.forEach(function(cl,k){h+='<li class="clue'+(k<shown?'':' hidden')+'">'+(k<shown?esc(cl):'Clue '+(k+1)+' hidden')+'</li>';});
      h+='</ul><div class="worth">Worth '+worth+' pts</div>'+(shown<4?'<button class="clue-btn" id="more">Reveal another clue</button>':'')+'<div class="opts" id="opts"></div><div class="fb" id="fb"></div><div id="iso"></div><button class="next" id="nx">Next case</button>';
      c.innerHTML=h;if($('more'))$('more').onclick=function(){shown++;render();};
      var box=$('opts');options.forEach(function(o){var b=el('button','opt',esc(o.n));b.onclick=function(){guess(o,b);};box.appendChild(b);});
      function guess(o,b){if(done)return;done=true;box.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});var ok=o.id===d.id;
        box.querySelectorAll('.opt')[options.indexOf(d)].classList.add('right');
        var lis=c.querySelectorAll('.clue');d.clues.forEach(function(cl,k){lis[k].className='clue';lis[k].textContent=cl;});
        if(c.querySelector('.worth'))c.querySelector('.worth').remove();if($('more'))$('more').remove();
        var fb=$('fb');
        if(ok){var r=hit(worth);fb.className='fb show good';fb.innerHTML='<strong>✓ '+esc(d.n)+'! +'+r.pts+(r.m>1?' ×'+r.m:'')+'</strong>'+esc(d.pearl);}
        else{b.classList.add('wrong');miss({key:'dz-'+d.id,prompt:'Which disease? '+d.clues.join(' '),options:[d.n],answer:0,explain:d.pearl});fb.className='fb show bad';fb.innerHTML='<strong>✗ It\u2019s '+esc(d.n)+'</strong>'+esc(d.pearl);}
        updHud();isoBonus();}
      function isoBonus(){var iso=$('iso');iso.innerHTML='<div class="prompt" style="font-size:1.02rem;margin-top:1rem">Bonus: which precautions for '+esc(d.n)+'?</div><div class="opts" id="isoOpts"></div><div class="fb" id="fb2"></div>';
        var choices=['Airborne','Droplet','Contact','Standard only'];var ib=$('isoOpts');var ans=d.iso==='Standard'?'Standard only':d.iso;
        choices.forEach(function(ch){var b=el('button','opt',ch);b.onclick=function(){ib.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});ib.querySelectorAll('.opt')[choices.indexOf(ans)].classList.add('right');var f=$('fb2');
          if(ch===ans){var r=hit(8);f.className='fb show good';f.innerHTML='<strong>✓ '+ans+' +'+r.pts+'</strong>'+(d.id==='varicella'?'Varicella is airborne + contact.':'');}
          else{b.classList.add('wrong');miss({key:'iso-'+d.id,prompt:'Precautions for '+d.n+'?',options:[ans],answer:0,explain:d.pearl});f.className='fb show bad';f.innerHTML='<strong>✗ '+ans+'</strong>'+(ans==='Standard only'?'Your study sheet doesn\u2019t list extra isolation for this one; standard precautions apply.':'');}
          updHud();var nx=$('nx');nx.classList.add('show');nx.focus();nx.onclick=function(){i++;show();};};ib.appendChild(b);});}
    }
    render();
  }
  show();
}

/* =====================================================================
   GAME 5 — ISOLATION SORT (fast, 3 lives)
   ===================================================================== */
function isoGame(){
  newRun();var c=shell('Isolation Sort');var deck=shuffle(ISO_ITEMS),i=0,lives=3;
  function heartTxt(){return '<span class="pill hearts">'+'❤️'.repeat(lives)+'🤍'.repeat(3-lives)+'</span>';}
  function show(){
    if(i>=deck.length||lives<=0)return results('iso','Isolation Sort',isoGame);
    setHud(heartTxt());prog(i,deck.length);var it=deck[i];var t0=Date.now(),LIM=7000,done=false;
    c.innerHTML='<div class="sub" style="text-align:center">Tap the precaution. Faster answers earn more points.</div><div class="bug">'+esc(it[0])+'</div><div class="timer"><i id="tm"></i></div><div class="bins" id="bins"></div><div class="fb" id="fb"></div>';
    var bins=$('bins');var defs=[['Airborne','air','N95 · negative pressure'],['Droplet','drop','Surgical mask within 3 ft'],['Contact','con','Gown + gloves']];
    defs.forEach(function(d){var b=el('button','bin '+d[1],d[0]+'<small>'+d[2]+'</small>');b.onclick=function(){go(d[0],b);};bins.appendChild(b);});
    var tick=setInterval(function(){var left=Math.max(0,LIM-(Date.now()-t0));var tm=$('tm');if(tm)tm.style.width=(left/LIM*100)+'%';if(left<=0){clearInterval(tick);go(null,null);}},80);timers.push(tick);
    function go(ch,b){if(done)return;done=true;clearInterval(tick);bins.querySelectorAll('.bin').forEach(function(x){x.disabled=true;});
      var ok=ch===it[1];var fb=$('fb');bins.querySelectorAll('.bin')[['Airborne','Droplet','Contact'].indexOf(it[1])].classList.add('right');
      if(ok){var fast=(Date.now()-t0)<3000;var r=hit(fast?12:8);fb.className='fb show good';fb.innerHTML='<strong>✓ '+it[1]+' +'+r.pts+'</strong>'+esc(it[2]);}
      else{if(b)b.classList.add('wrong');lives--;miss({key:'iso2-'+it[0],prompt:'Precautions for '+it[0]+'?',options:[it[1]],answer:0,explain:it[2]});fb.className='fb show bad';fb.innerHTML='<strong>'+(ch?'✗ ':'⏰ Time\u2019s up: ')+it[0]+' = '+it[1]+'</strong>'+esc(it[2]);}
      setHud(heartTxt());timers.push(setTimeout(function(){i++;show();},ok?900:2000));}
  }
  show();
}

/* =====================================================================
   GAME 6 — SHOT CLOCK (vaccine schedule)
   ===================================================================== */
function shotGame(){
  newRun();var c=shell('Shot Clock');var deck=shuffle(VISITS),i=0;
  function show(){
    if(i>=deck.length)return results('shot','Shot Clock',shotGame);
    setHud();prog(i,deck.length);var v=deck[i];var sel={};var done=false;
    c.innerHTML='<div class="visit"><span class="age">'+v.age+'</span><span class="sub">Healthy child, on schedule. Tap every vaccine due at this visit.</span></div><div class="chips" id="chips"></div><button class="primary" id="chk">Check my shots</button><div class="legend hide" id="lg"><span class="l1">Correct</span><span class="l2">Missed (due today)</span><span class="l3">Not due</span><span class="l4">Also acceptable here</span></div><div class="fb" id="fb"></div><button class="next" id="nx">Next visit</button>';
    var chips=$('chips');VACS.forEach(function(name){var b=el('button','chip',name);b.setAttribute('aria-pressed','false');b.onclick=function(){if(done)return;sel[name]=!sel[name];b.classList.toggle('sel',!!sel[name]);b.setAttribute('aria-pressed',sel[name]?'true':'false');};chips.appendChild(b);});
    $('chk').onclick=function(){if(done)return;done=true;$('chk').classList.add('hide');$('lg').classList.remove('hide');
      var bad=0,missed=0;
      chips.querySelectorAll('.chip').forEach(function(b){var n=b.textContent;var s=!!sel[n];var req=v.req.indexOf(n)!==-1,opt=v.opt.indexOf(n)!==-1;b.className='chip';
        if(req&&s)b.classList.add('c-ok');else if(req&&!s){b.classList.add('c-miss');missed++;}else if(!req&&s&&opt)b.classList.add('c-opt');else if(!req&&s){b.classList.add('c-bad');bad++;}else if(opt)b.classList.add('c-opt');});
      var fb=$('fb');var perfect=!bad&&!missed;
      if(perfect){var r=hit(25);fb.className='fb show good';fb.innerHTML='<strong>✓ Perfect visit! +'+r.pts+(r.m>1?' ×'+r.m:'')+'</strong>'+esc(v.note);}
      else{var partial=Math.max(0,v.req.length-missed-bad);if(partial>0){run.score+=partial*3;addXP(partial*3);}
        miss({key:'shot-'+v.age,prompt:'Vaccines due at '+v.age+'?',options:[v.req.join(', ')],answer:0,explain:v.note});
        fb.className='fb show bad';fb.innerHTML='<strong>✗ Due at '+v.age+': '+esc(v.req.join(', '))+'</strong>'+esc(v.note)+(partial?' (+'+partial*3+' partial points)':'');}
      updHud();var nx=$('nx');nx.classList.add('show');nx.focus();nx.onclick=function(){i++;show();};};
  }
  show();
}

/* =====================================================================
   GAME 7 — LIGHTNING ROUND (60 seconds, mixed)
   ===================================================================== */
function makeQ(){
  var r=Math.random();
  if(r<0.12){var cs=makeVitalsCase();var it=cs.items[Math.floor(Math.random()*cs.items.length)];return {key:'vit-'+cs.g+'-'+it.k,prompt:'A '+cs.age+' has a '+it.k.toLowerCase()+' of '+it.v+'. Normal?',options:['Normal','Report'],answer:it.normal?0:1,explain:it.why};}
  if(r<0.2){var fd=FEEDS[Math.floor(Math.random()*FEEDS.length)];var fr=FEED_AGES.filter(function(a){return a.v===fd.a[0];})[0];var rl=fr.l+(fr.u?' '+fr.u:'');var fo=shuffle([rl].concat(pick(FEED_AGES.filter(function(a){return fd.a.indexOf(a.v)===-1;}),3).map(function(a){return a.l+(a.u?' '+a.u:'');})));return {key:fd.id,prompt:'Feeding: '+fd.t+'. When?',options:fo,answer:fo.indexOf(rl),explain:fd.why};}
  r=Math.random();
  if(r<0.3){var t=TF[Math.floor(Math.random()*TF.length)];return {key:'tf-'+t[0].slice(0,30),prompt:t[0],options:['True','False'],answer:t[1]?0:1,explain:t[2],tf:true};}
  if(r<0.5){var m=MILESTONES[Math.floor(Math.random()*MILESTONES.length)];var right=ageLabel(m.a[0]);var others=pick(AGES.filter(function(a){return m.a.indexOf(a.v)===-1;}),3).map(function(a){return a.l+' '+a.u;});var o=shuffle([right].concat(others));return {key:m.id,prompt:'When? '+m.t,options:o,answer:o.indexOf(right),explain:m.why};}
  if(r<0.68){var d=DISEASES[Math.floor(Math.random()*DISEASES.length)];var cl=d.clues[1+Math.floor(Math.random()*3)];var o2=shuffle([d.n].concat(pick(DISEASES.filter(function(x){return x.id!==d.id;}),3).map(function(x){return x.n;})));return {key:'dz-'+d.id,prompt:cl,options:o2,answer:o2.indexOf(d.n),explain:d.pearl};}
  if(r<0.84){var g=GROUPS[Math.floor(Math.random()*GROUPS.length)];var cl2=CLUES[g][Math.floor(Math.random()*CLUES[g].length)];var o3=GROUPS.slice();return {key:'kid-'+g+'-'+cl2.slice(0,24),prompt:'Which age group? "'+cl2+'"',options:o3,answer:o3.indexOf(g),explain:'That\u2019s a '+g.toLowerCase()+' ('+GROUP_AGES[g]+') fact.'};}
  var v=VISITS[Math.floor(Math.random()*VISITS.length)];var vac=v.req[Math.floor(Math.random()*v.req.length)];var wrongAges=pick(VISITS.filter(function(x){return x.req.indexOf(vac)===-1&&x.opt.indexOf(vac)===-1;}),3).map(function(x){return x.age;});
  if(wrongAges.length<3)return makeQ();var o4=shuffle([v.age].concat(wrongAges));return {key:'shot-'+v.age,prompt:'A dose of '+vac+' is due at which visit?',options:o4,answer:o4.indexOf(v.age),explain:v.note};
}
function lightningGame(){
  newRun();var c=shell('Lightning Round');var left=60,endAt=Date.now()+60000;
  function clock(){return '<span class="pill">⏱ <b id="clk">'+left+'</b>s</span>';}
  setHud(clock());
  var t=setInterval(function(){left=Math.max(0,Math.ceil((endAt-Date.now())/1000));var k=$('clk');if(k)k.textContent=left;prog(60-left,60);if(left<=0){clearInterval(t);results('light','Lightning Round',lightningGame);}},250);timers.push(t);
  function nextQ(){if(left<=0)return;var q=makeQ();mcq(c,q,nextQ,{auto:true,base:10});setHud(clock());}
  nextQ();
}

/* =====================================================================
   REVIEW MY MISSES
   ===================================================================== */
function reviewGame(){
  newRun();var c=shell('Review My Misses');
  if(!S.misses.length){c.innerHTML='<div class="prompt">No misses saved yet.</div><p class="sub">Anything you miss in any game lands here so you can drill it until it sticks.</p><button class="primary" id="toMenu">Pick a game</button>';$('toMenu').onclick=home;setHud();return;}
  var pool=S.misses.slice(0,12).map(function(m){
    var correct=m.options[m.answer];var distract=[];
    // rebuild choices so the review is a real question
    if(/^When: /.test(m.prompt)||/^When\? /.test(m.prompt)){distract=pick(AGES.map(function(a){return a.l+' '+a.u;}).filter(function(x){return correct.indexOf(x)===-1;}),3);}
    else if(/^Feed: /.test(m.prompt)){distract=pick(FEED_AGES.map(function(a){return a.l+(a.u?' '+a.u:'');}).filter(function(x){return correct.indexOf(x)===-1;}),3);}
    else if(/normal range\?$/.test(m.prompt)){var all=[];VR.forEach(function(r){all.push(r.hr[0]+'–'+r.hr[1]);all.push(r.rr[0]+'–'+r.rr[1]);});all.push('<120/80');distract=pick(all.filter(function(x,ix){return x!==correct&&all.indexOf(x)===ix;}),3);}
    else if(/^Which disease\?/.test(m.prompt)){distract=pick(DISEASES.map(function(d){return d.n;}).filter(function(x){return x!==correct;}),3);}
    else if(/^Which age group\?/.test(m.prompt)){distract=GROUPS.filter(function(x){return x!==correct;});}
    else if(/^Precautions/.test(m.prompt)){distract=['Airborne','Droplet','Contact','Standard only'].filter(function(x){return x!==correct;});}
    else if(/^Vaccines due/.test(m.prompt)){var others=VISITS.filter(function(v){return v.req.join(', ')!==correct;});distract=pick(others,3).map(function(v){return v.req.join(', ');});}
    else if(m.options.length>1){return {key:m.key,prompt:m.prompt,options:m.options,answer:m.answer,explain:m.explain};}
    var o=shuffle([correct].concat(distract));return {key:m.key,prompt:m.prompt.replace(/^When: /,'When does this happen? ').replace(/^Feed: /,'When? ').replace(/\?$/,'?'),options:o,answer:o.indexOf(correct),explain:m.explain};
  });
  pool=shuffle(pool);var i=0;
  function nextQ(){if(i>=pool.length)return results('review','Review',reviewGame);prog(i,pool.length);setHud('<span class="pill">Left <b>'+(pool.length-i)+'</b></span>');var q=pool[i];i++;mcq(c,q,nextQ,{review:true,base:10});}
  nextQ();
}

  '<div class="section-h"><h2>Both modules</h2></div><div class="games">'+
